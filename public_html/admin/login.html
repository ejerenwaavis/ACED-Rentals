<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — ACED Rentals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F4F0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 selection:bg-orange-500 selection:text-white">
  <div class="w-full max-w-md bg-white border border-zinc-200/80 rounded-3xl p-8 sm:p-10 shadow-xl shadow-zinc-950/5">
    
    <div class="text-center mb-8">
      <a href="/" class="inline-flex flex-col items-center group">
        <span class="text-2xl font-black tracking-tight text-zinc-900 group-hover:text-orange-600 transition-colors">ACED</span>
        <span class="text-[9px] font-semibold tracking-[0.3em] uppercase text-zinc-500 -mt-1">Rentals</span>
      </a>
      <h1 class="mt-4 text-xl font-bold text-zinc-900 tracking-tight">Admin Portal</h1>
      <p class="text-xs text-zinc-500 mt-1">Sign in to manage the early access waitlist</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Username</label>
        <input
          id="username"
          type="text"
          required
          autocomplete="username"
          placeholder="admin"
          class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none transition-all"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="••••••••••••"
          class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none transition-all"
        />
      </div>

      <div id="loginError" class="hidden text-xs text-rose-600 font-medium px-3 py-2 bg-rose-50 border border-rose-200 rounded-lg"></div>

      <button
        type="submit"
        id="loginBtn"
        class="w-full py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-orange-600 text-white font-semibold text-sm transition-all shadow-sm cursor-pointer disabled:opacity-50"
      >
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-zinc-500 hover:text-zinc-800 transition-colors">
        &larr; Back to ACED Rentals Home
      </a>
    </div>

  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      btnText.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Login failed.');
        }

        window.location.href = '/admin';
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
